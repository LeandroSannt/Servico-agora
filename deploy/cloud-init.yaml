#cloud-config
# Cloud-Init para VPS Locaweb (Ubuntu 24.04) - Servico Agora
# Prepara o servidor com Docker, firewall, swap e usuario "deploy".
# O projeto em si e subido depois via SSH (ver deploy/README.md).

timezone: America/Sao_Paulo
locale: pt_BR.UTF-8

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw
  - fail2ban
  - unattended-upgrades
  - htop

groups:
  - docker

users:
  - default
  - name: deploy
    gecos: Deploy Servico Agora
    shell: /bin/bash
    groups: [sudo, docker]
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINfCXzB508Lsg3HQ0OmEpqUSa7oEvUPi6qH9mNQDzWVu servico-agora-vps

write_files:
  # SSH: so chave publica, sem senha
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      MaxAuthTries 3

  # fail2ban protegendo o SSH
  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 1h
      findtime = 10m
      maxretry = 5

      [sshd]
      enabled = true

  # Docker: limitar tamanho dos logs dos containers
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "20m", "max-file": "5" }
      }

runcmd:
  # --- Docker (repositorio oficial) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # --- Swap de 2 GB (ajuda no build do Next.js em VPS pequena) ---
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl -w vm.swappiness=10
  - echo 'vm.swappiness=10' > /etc/sysctl.d/99-swappiness.conf

  # --- Firewall: so SSH, HTTP e HTTPS ---
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # --- Servicos ---
  - systemctl enable --now fail2ban
  - systemctl restart ssh

  # --- Pasta do projeto ---
  - mkdir -p /opt/servico-agora
  - chown -R deploy:deploy /opt/servico-agora

final_message: "Servidor pronto em $UPTIME s. Conecte com: ssh deploy@<IP>"
